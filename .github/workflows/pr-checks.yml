name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix: handle empty report'. Got: $TITLE"
            exit 1
          fi

  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -qx 'CHANGELOG.md'; then
            exit 0
          fi
          echo "::error::Add an entry under '## Unreleased' in CHANGELOG.md, or apply the 'skip-changelog' label for changes with no user-visible effect (CI, docs, tests)."
          exit 1
