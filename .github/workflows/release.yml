name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  # The bb CLI that builds the plugin (npm package bb-app, bin bb). Keep in step with ci.yml.
  BB_APP_VERSION: 0.49.0

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: bb plugin build
        run: npx --yes --package="bb-app@${BB_APP_VERSION}" bb plugin build
      - name: Check the bundles exist
        run: test -s dist/server.js && test -s dist/app.js && test -s dist/host.js
      - name: Verify tag, package version and changelog agree
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
